# Same nginx Deployment as nginx-pods.yaml, but pinned to the "demo" namespace.
# Apply namespace.yaml first, otherwise the namespace won't exist.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-nginx
  namespace: demo
spec:
  selector:
    matchLabels:
      run: my-nginx
  replicas: 2
  template:
    metadata:
      labels:
        run: my-nginx
    spec:
      containers:
      - name: my-nginx
        image: nginx
        ports:
        - containerPort: 80
