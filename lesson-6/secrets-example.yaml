# BAD PATTERN — do not do this in real clusters.
# A Kubernetes Secret manifest committed to git is NOT secret: `data:` is base64,
# not encryption. Anyone with repo access can `echo ... | base64 -d` and read it.
# Gitleaks won't catch this either — it doesn't decode base64, and K8s Secret
# `data:` fields are base64 by design, so flagging them would be pure noise.
#
# Use one of these instead:
#   - SealedSecrets (bitnami)        — encrypted manifests safe to commit
#   - External Secrets Operator      — pulls from Vault / AWS SM / GCP SM at runtime
#   - SOPS + age/KMS                 — encrypt the file before committing
#   - kubectl create secret ...      — create out-of-band, never commit
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
type: Opaque
data:
  password: c3VwZXJzZWNyZXRwYXNzd29yZA==  # base64("supersecretpassword") — readable to anyone with repo access  # gitleaks:allow
